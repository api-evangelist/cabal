aid: cabal
name: Cabal
description: >-
  Cabal is an AI-powered relationship-intelligence and warm-introduction platform
  that turns an organization's professional relationships into warm introductions.
  It infers connections across millions of professional records without CSV uploads
  or calendar syncs, letting teams "ask who's connected to anyone." Cabal serves VC
  platform / deal-sourcing teams, sales organizations, and investor-relations and
  partnerships teams, and ships Cabal Mail for bulk personalized outreach (company
  updates, LP communications, strategic asks). The relationship graph is queryable
  through in-app chat, Claude and ChatGPT via the Model Context Protocol (MCP), a
  Slack bot, or an API. Backed by Craft Ventures. This profile was enriched by the
  API Evangelist pipeline from Cabal's public surface; the company advertises API
  and MCP access but does not publish a public OpenAPI spec or open developer
  reference (both are account-gated).
